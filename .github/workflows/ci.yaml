name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ./.github/workflows/format_check.sh

  floor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -c constraints-floor.txt -e ".[export,test]"
      - run: pytest tests

  latest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[export,test]"
      - run: pytest tests

  gpu:
    runs-on: [self-hosted, linux, gpu]
    strategy:
      matrix:
        include:
          - cuda: cu118
            trt: tensorrt-cu11
          - cuda: cu128
            trt: tensorrt-cu12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/${{ matrix.cuda }}
      - run: pip install -e ".[export,test]" "${{ matrix.trt }}>=10,<11"
      - run: pytest tests/utils/test_trt.py
